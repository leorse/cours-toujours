{% extends "debug/base_debug.html" %}

{% block debug_content %}
<!-- Animation Tests -->
<div class="section-card">
    <h2 class="section-title">🧪 Tests des Animations</h2>
    <div style="display: flex; gap: 1rem;">
        <button onclick="triggerFlashAnimation()" class="btn-primary" style="padding: 0.8rem 1.5rem;">
            ⚡ Tester l'animation Flash
        </button>
        <button onclick="confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } })" class="btn-secondary"
            style="padding: 0.8rem 1.5rem;">
            🎉 Tester Confetti
        </button>
    </div>
</div>
{% endblock %}
