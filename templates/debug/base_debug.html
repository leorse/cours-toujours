{% extends "base.html" %}

{% block title %}Debug - Parcours{% endblock %}

{% block head %}
<style>
    .debug-container {
        padding: 2rem;
        max-width: 1200px;
        margin: 0 auto;
    }

    .section-card {
        background: var(--surface);
        border: 2px solid var(--text);
        border-radius: 16px;
        padding: 2rem;
        margin-bottom: 2rem;
        box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.1);
    }

    .section-title {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
        color: var(--primary);
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .debug-nav {
        display: flex;
        gap: 1rem;
        margin-bottom: 2rem;
        overflow-x: auto;
        padding-bottom: 0.5rem;
        border-bottom: 2px solid var(--text);
    }

    .debug-nav-link {
        padding: 0.5rem 1rem;
        border-radius: 8px;
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 600;
        transition: all 0.2s;
    }

    .debug-nav-link:hover,
    .debug-nav-link.active {
        background: var(--surface-hover);
        color: var(--primary);
        font-weight: 800;
    }
</style>
<style>
    /* Shared styles for inner pages */
    .stats-table {
        width: 100%;
        border-collapse: collapse;
    }

    .stats-table th,
    .stats-table td {
        padding: 1rem;
        text-align: left;
        border-bottom: 1px solid var(--text-muted);
        color: var(--text);
    }

    .stats-table th {
        color: var(--text-muted);
        font-weight: 700;
        font-size: 0.9rem;
        text-transform: uppercase;
    }

    .user-badge {
        display: flex;
        align-items: center;
        gap: 0.8rem;
    }

    .user-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--primary);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.8rem;
        border: 1px solid var(--text);
    }

    .xp-badge {
        background: rgba(245, 158, 11, 0.1);
        color: #f59e0b;
        padding: 0.2rem 0.6rem;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
        border: 1px solid #f59e0b;
    }

    .subject-group {
        margin-bottom: 2rem;
    }

    .subject-header {
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 2px solid var(--text);
        color: var(--text);
    }

    .exercise-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1rem;
    }

    .exercise-card {
        background: var(--surface);
        border: 2px solid var(--text);
        border-radius: 12px;
        padding: 1rem;
        transition: transform 0.2s, background 0.2s;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
    }

    .exercise-card:hover {
        transform: translateY(-2px);
        box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.1);
    }

    .exercise-info {
        margin-bottom: 1rem;
    }

    .exercise-id {
        font-family: monospace;
        font-size: 0.8rem;
        color: var(--text-muted);
    }

    .exercise-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-top: 0.5rem;
    }

    .tag-badge {
        font-size: 0.7rem;
        padding: 0.1rem 0.4rem;
        border-radius: 4px;
        background: var(--surface-hover);
        color: var(--text);
        border: 1px solid var(--text-muted);
    }

    .exercise-actions {
        display: flex;
        gap: 0.5rem;
    }

    .btn-test {
        flex: 1;
        padding: 0.5rem;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        text-align: center;
        text-decoration: none;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.3rem;
        border: 2px solid var(--text);
    }

    .btn-practice {
        background: var(--surface-hover);
        color: var(--text);
    }

    .btn-practice:hover {
        background: var(--text);
        color: var(--surface);
    }

    .btn-flash {
        background: linear-gradient(135deg, #f59e0b, #d97706);
        color: white;
        border: 2px solid #d97706;
    }

    .btn-flash:hover {
        filter: brightness(1.1);
    }

    .difficulty-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 4px;
        border: 1px solid var(--text);
    }

    .diff-1 {
        background: #10b981;
    }

    .diff-2 {
        background: #f59e0b;
    }

    .diff-3 {
        background: #ef4444;
    }
</style>
{% endblock %}

{% block content %}
<div class="debug-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h1 class="page-title" style="margin: 0;">🛠️ Dashboard de Débogage</h1>
        <a href="/" class="btn-secondary">Retour au site</a>
    </div>

    <nav class="debug-nav">
        <a href="/debug/stats" class="debug-nav-link {% if active_tab == 'stats' %}active{% endif %}">
            👥 Statistiques
        </a>
        <a href="/debug/exercises" class="debug-nav-link {% if active_tab == 'exercises' %}active{% endif %}">
            📚 Exercices
        </a>
        <a href="/debug/dialogues" class="debug-nav-link {% if active_tab == 'dialogues' %}active{% endif %}">
            💬 Dialogues
        </a>
        <a href="/debug/animations" class="debug-nav-link {% if active_tab == 'animations' %}active{% endif %}">
            ✨ Animations
        </a>
    </nav>

    {% block debug_content %}{% endblock %}
</div>
{% endblock %}
