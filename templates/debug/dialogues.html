{% extends "debug/base_debug.html" %}

{% block debug_content %}
<!-- Dialogues -->
<div class="section-card">
    <h2 class="section-title">💬 Dialogues</h2>
    <div class="exercise-grid">
        {% for d in dialogues %}
        <div class="exercise-card" style="border-left: 4px solid var(--primary);">
            <div class="exercise-info">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div class="exercise-id" style="color: var(--text-muted);">{{ d.id }}</div>
                    <span class="tag-badge" style="background: rgba(85, 166, 48, 0.1); color: var(--primary);">{{
                        d.subject }}</span>
                </div>
                <div style="font-weight: 600; margin-top: 0.3rem;">
                    {{ d.name }}
                </div>
                <div class="exercise-tags">
                    <span class="tag-badge">{{ d.type }}</span>
                    <div style="font-size: 0.7rem; color: var(--text-muted); margin-top:4px;">{{ d.path }}</div>
                </div>
            </div>
            <div class="exercise-actions">
                {% if d.type == 'event' %}
                <a href="/event/{{ d.id }}" class="btn-test btn-practice">
                    ▶️ Event
                </a>
                {% else %}
                <a href="/debug/view_dialogue?path={{ d.path }}&subject={{ d.subject }}" class="btn-test btn-flash">
                    👁️ Preview
                </a>
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
