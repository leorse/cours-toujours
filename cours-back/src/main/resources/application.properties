server.port=8080
spring.application.name=parcours-back

parcours.cors.allowed-origins=http://localhost:5173

spring.datasource.url=jdbc:sqlite:content.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

parcours.content.path=content

server.servlet.session.cookie.name=parcours_session
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=7d

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.fr.parcours=INFO
